<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Wordbook — вход</title>
        <link rel="manifest" href="manifest.json">
        <meta name="theme-color" content="#7a5c3e">
        <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
        <link rel="apple-touch-icon" href="icon-192.png">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="default">
        <meta name="apple-mobile-web-app-title" content="Wordbook">
        <link rel="stylesheet" href="common.css">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!-- Auth preloader (показывается при автологине) -->
        <div class="preloader" id="authPreloader" style="display: none;">
        <div class="preloader-inner">
            <div class="preloader-mark">
            <div class="preloader-logo">W</div>
            </div>
            <div style="text-align: center;">
            <div class="preloader-title">Wordbook</div>
            <div class="preloader-sub">Вход</div>
            </div>
            <div class="preloader-dots">
            <span></span><span></span><span></span>
            </div>
        </div>
        </div>

        <div class="auth-screen" id="authScreen">
            <button class="auth-theme-toggle" id="authThemeToggle" type="button" title="Переключить тему" aria-label="Переключить тему">
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                </svg>
            </button>

            <div class="auth-card">
                <div class="auth-brand">
                    <div class="auth-logo">W</div>
                    <div class="auth-title">Wordbook</div>
                    <div class="auth-sub">Лексикон</div>
                </div>

                <form class="auth-form" id="authForm" autocomplete="off" novalidate>
                    <h2 class="auth-heading" id="authHeading">Вход в словарь</h2>

                    <div class="auth-blocked-banner" id="authBlockedBanner">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <div class="text">
                            <b>Аккаунт заблокирован</b>
                            <span id="authBlockedText">Обратитесь к администратору.</span>
                        </div>
                    </div>

                    <div class="auth-field">
                        <label for="authName" id="authNameLabel">Имя</label>
                        <input type="text" id="authName" autocomplete="username" spellcheck="false">
                        <div class="auth-err" id="authNameErr"></div>
                    </div>

                    <div class="auth-field">
                        <label for="authPass">Пароль <span id="authPassHint" hidden>— минимум 6 символов</span></label>
                        <div class="auth-input-wrap">
                            <input type="password" id="authPass" autocomplete="current-password">
                            <button class="auth-eye" type="button" data-eye-target="authPass" aria-label="Показать пароль">
                                <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                        <div class="auth-err" id="authPassErr"></div>
                    </div>

                    <div class="auth-field" id="authConfirmField" hidden>
                        <label for="authConfirm">Повтор пароля</label>
                        <div class="auth-input-wrap">
                            <input type="password" id="authConfirm" autocomplete="new-password">
                            <button class="auth-eye" type="button" data-eye-target="authConfirm" aria-label="Показать пароль">
                                <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                        <div class="auth-err" id="authConfirmErr"></div>
                    </div>

                    <label class="auth-remember" id="authRememberWrap">
                        <input type="checkbox" id="authRemember" checked>
                        <span>Запомнить меня</span>
                    </label>
                    <button class="auth-submit" type="submit" id="authSubmit">Войти</button>

                    <div class="auth-switch" id="authUserSwitchWrap">
                        <span id="authSwitchText">Нет записи?</span>
                        <button type="button" id="authSwitch">Создать</button>
                    </div>

                    <div class="auth-switch" id="authAdminSwitchWrap">
                        <button type="button" id="authAdminSwitch">Вход для администратора</button>
                    </div>
                </form>
            </div>
        </div>

        <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

        <script src="common.js"></script>
        <script src="firebase.js"></script>
        <script src="app.js"></script>
        <script src="pwa-install.js"></script>
    </body>
</html>
