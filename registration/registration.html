<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Wordbook — лексикон</title>
        <link rel="stylesheet" href="registration.css">
    </head>
    <body>

        <!-- ============ AUTH SCREEN ============ -->
        <div class="auth-screen" id="authScreen">
        <button class="auth-theme-toggle" id="authThemeToggle" type="button" title="Переключить тему" aria-label="Переключить тему">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
        </button>

        <div class="auth-card">
            <div class="auth-brand">
            <div class="auth-logo">W</div>
            <div class="auth-title">Wordbook</div>
            <div class="auth-sub">Лексикон</div>
            </div>

            <form class="auth-form" id="authForm" autocomplete="off" novalidate>
            <h2 class="auth-heading" id="authHeading">Вход в словарь</h2>

            <!-- Баннер блокировки -->
            <div class="auth-blocked-banner" id="authBlockedBanner">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <div class="text">
                <b>Аккаунт заблокирован</b>
                <span id="authBlockedText">Обратитесь к администратору.</span>
                </div>
            </div>

            <div class="auth-field">
                <label for="authName">Имя</label>
                <input type="text" id="authName" autocomplete="username" spellcheck="false">
                <div class="auth-err" id="authNameErr"></div>
            </div>

            <div class="auth-field">
                <label for="authPass">Пароль</label>
                <input type="password" id="authPass" autocomplete="current-password">
                <div class="auth-err" id="authPassErr"></div>
            </div>

            <div class="auth-field" id="authConfirmField" hidden>
                <label for="authConfirm">Повтор пароля</label>
                <input type="password" id="authConfirm" autocomplete="new-password">
                <div class="auth-err" id="authConfirmErr"></div>
            </div>

            <button class="auth-submit" type="submit" id="authSubmit">Войти</button>

            <div class="auth-switch">
                <span id="authSwitchText">Нет записи?</span>
                <button type="button" id="authSwitch">Создать</button>
            </div>
            </form>
        </div>
        </div>

        <!-- ============ APP ============ -->
        <div class="app" id="appRoot">
        <aside class="sidebar">
            <div class="brand">
            <div class="brand-logo">W</div>
            <div>
                <div class="brand-title">Wordbook</div>
                <div class="brand-sub">Лексикон</div>
            </div>
            </div>

            <div id="allWordsBlock"></div>

            <div class="sidebar-label">Разделы</div>

            <div class="sidebar-scroll">
            <div id="sectionsList"></div>
            <div id="addSectionWrap"></div>
            </div>

            <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="sidebar-user-avatar" id="userInitial">W</div>
                <div class="sidebar-user-info">
                <div class="sidebar-user-name" id="userName">Гость</div>
                <div class="sidebar-user-role">читатель</div>
                </div>
                <button class="logout-btn" id="logoutBtn" type="button" title="Выйти">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                </button>
            </div>

            <button class="theme-toggle" id="themeToggle" type="button">
                <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                </svg>
                <span id="themeLabel">Тёмная тема</span>
            </button>
            </div>
        </aside>

        <main class="main">
            <div class="main-header">
            <div class="calendar" id="calendar"></div>

            <div class="main-title-row">
                <div class="main-title-wrap">
                <div class="main-title" id="mainTitle">Все слова</div>
                <div class="title-count" id="titleCount"></div>
                </div>
                <button class="btn-primary" id="addWordBtn" type="button">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                Добавить слово
                </button>
            </div>

            <div class="toolbar">
                <div class="search">
                <input type="text" id="searchInput" placeholder="Поиск по словам..." autocomplete="off">
                <button class="search-clear" id="searchClear" type="button" hidden>✕</button>
                </div>
                <button class="tool-btn" id="shuffleBtn" type="button" title="Перемешать слова">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
                <span id="shuffleLabel">Перемешать</span>
                <span class="shuffle-off" id="shuffleOff" title="Отключить">✕</span>
                </button>
            </div>
            </div>

            <div class="head-row">
            <div>Слово</div>
            <div>Произношение</div>
            <div>Перевод</div>
            <div></div>
            </div>

            <div class="word-list" id="wordList"></div>

            <div class="pagination" id="pagination" hidden></div>
        </main>
        </div>

        <!-- MODAL: WORD -->
        <div class="modal-overlay" id="wordModal">
        <div class="modal">
            <h2 id="modalTitle">Новое слово</h2>

            <div class="form-group">
            <label for="inEn">Английский</label>
            <input type="text" id="inEn" placeholder="hello" autocomplete="off" spellcheck="false">
            <div class="field-msg" id="errEn"></div>
            </div>

            <div class="form-group">
            <label for="inTr">Транскрипция <span class="hint">— необязательно</span></label>
            <input type="text" id="inTr" placeholder="/həˈloʊ/" autocomplete="off" spellcheck="false">
            </div>

            <div class="form-group">
            <label for="inRu">Русский перевод</label>
            <input type="text" id="inRu" placeholder="привет" autocomplete="off" spellcheck="false">
            <div class="field-msg" id="errRu"></div>
            </div>

            <div class="form-group">
            <label for="inSection">Раздел</label>
            <select id="inSection"></select>
            </div>

            <div class="modal-actions">
            <button class="btn-ghost" type="button" id="cancelWord">Отмена</button>
            <button class="btn-primary" type="button" id="saveWord">Добавить</button>
            </div>
        </div>
        </div>

        <!-- MODAL: CONFIRM -->
        <div class="modal-overlay" id="confirmModal">
        <div class="modal modal-sm">
            <h2 id="confirmTitle">Подтвердите</h2>
            <p id="confirmText"></p>
            <div class="modal-actions">
            <button class="btn-ghost" type="button" id="confirmCancel">Отмена</button>
            <button class="btn-danger" type="button" id="confirmOk">Удалить</button>
            </div>
        </div>
        </div>

        <script src="registration.js"></script>
        
    </body>
</html>
