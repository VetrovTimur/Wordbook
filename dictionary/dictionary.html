<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Wordbook — лексикон</title>
        <link rel="stylesheet" href="dictionary.css">
    </head>
    <body data-theme="light">

        <!-- Preloader -->
        <div class="preloader" id="preloader">
        <div class="preloader-inner">
            <div class="preloader-mark">
            <div class="preloader-logo">W</div>
            </div>
            <div style="text-align: center;">
            <div class="preloader-title">Wordbook</div>
            <div class="preloader-sub">Лексикон</div>
            </div>
            <div class="preloader-dots">
            <span></span><span></span><span></span>
            </div>
            <div class="preloader-bar">
            <div class="preloader-bar-fill" id="preloaderBar"></div>
            </div>
        </div>
        </div>

        <div class="app">
        <aside class="sidebar">
            <div class="brand">
            <div class="brand-logo">W</div>
            <div>
                <div class="brand-title">Wordbook</div>
                <div class="brand-sub">Лексикон</div>
            </div>
            </div>

            <div class="user-wrap">
            <button class="user-card" id="userCard" type="button" aria-haspopup="menu" aria-expanded="false">
                <div class="user-avatar" id="userInitial">Ч</div>
                <div class="user-info">
                <div class="user-name" id="userName">Читатель</div>
                <div class="user-role" id="userRole">читатель</div>
                </div>
                <div class="user-caret">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
            </button>

            <div class="user-dropdown" id="userDropdown" role="menu">
                <button class="dropdown-item" id="menuDict" type="button" role="menuitem">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                </svg>
                <span>Словарь</span>
                </button>
                <button class="dropdown-item" id="menuStats" type="button" role="menuitem">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="20" x2="18" y2="10"/>
                    <line x1="12" y1="20" x2="12" y2="4"/>
                    <line x1="6" y1="20" x2="6" y2="14"/>
                </svg>
                <span>Статистика</span>
                </button>
                <div class="dropdown-divider"></div>
                <button class="dropdown-item danger" id="menuLogout" type="button" role="menuitem">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                <span>Сбросить имя</span>
                </button>
            </div>
            </div>

            <div id="allWordsBlock"></div>

            <div class="sidebar-label">Разделы</div>

            <div class="sidebar-scroll">
            <div id="sectionsList"></div>
            <div id="addSectionWrap"></div>
            </div>

            <div class="sidebar-footer">
            <button class="theme-toggle" id="themeToggle" type="button">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <span id="themeLabel">Тёмная тема</span>
            </button>
            </div>
        </aside>

        <main class="main">
            <div class="main-header">
            <div class="calendar" id="calendar"></div>

            <div class="main-title-row">
                <div class="main-title-wrap">
                <div class="main-title" id="mainTitle">Все слова</div>
                <div class="title-count" id="titleCount"></div>
                </div>
                <div class="title-actions">
                <button class="btn-back" id="backToDictBtn" type="button">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"/>
                    <polyline points="12 19 5 12 12 5"/>
                    </svg>
                    Словарь
                </button>
                <button class="btn-primary" id="addWordBtn" type="button">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                    Добавить слово
                </button>
                </div>
            </div>

            <div class="toolbar">
                <div class="search">
                <input type="text" id="searchInput" placeholder="Поиск по словам..." autocomplete="off">
                <button class="search-clear" id="searchClear" type="button" hidden>✕</button>
                </div>
                <button class="tool-btn" id="shuffleBtn" type="button" title="Перемешать слова">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
                Перемешать
                </button>
            </div>
            </div>

            <div class="head-row">
            <div>Слово</div>
            <div>Произношение</div>
            <div>Перевод</div>
            <div></div>
            </div>

            <div class="word-list" id="wordList"></div>

            <div class="pagination" id="pagination" hidden></div>
        </main>
        </div>

        <div class="modal-overlay" id="wordModal">
        <div class="modal">
            <h2 id="modalTitle">Новое слово</h2>
            <div class="form-group">
            <label for="inEn">Английский</label>
            <input type="text" id="inEn" placeholder="hello" autocomplete="off" spellcheck="false">
            <div class="field-msg" id="errEn"></div>
            </div>
            <div class="form-group">
            <label for="inTr">Транскрипция <span class="hint">— необязательно</span></label>
            <input type="text" id="inTr" placeholder="/həˈloʊ/" autocomplete="off" spellcheck="false">
            </div>
            <div class="form-group">
            <label for="inRu">Русский перевод</label>
            <input type="text" id="inRu" placeholder="привет" autocomplete="off" spellcheck="false">
            <div class="field-msg" id="errRu"></div>
            </div>
            <div class="form-group">
            <label for="inSection">Раздел</label>
            <select id="inSection"></select>
            </div>
            <div class="modal-actions">
            <button class="btn-ghost" type="button" id="cancelWord">Отмена</button>
            <button class="btn-primary" type="button" id="saveWord">Добавить</button>
            </div>
        </div>
        </div>

        <div class="modal-overlay" id="confirmModal">
        <div class="modal modal-sm">
            <h2 id="confirmTitle">Подтвердите</h2>
            <p id="confirmText"></p>
            <div class="modal-actions">
            <button class="btn-ghost" type="button" id="confirmCancel">Отмена</button>
            <button class="btn-danger" type="button" id="confirmOk">Удалить</button>
            </div>
        </div>
        </div>

        <!-- Firebase SDK (compat) -->
        <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

        <script src="../firebase.js"></script>
        <script src="dictionary.js"></script>
    </body>
</html>
