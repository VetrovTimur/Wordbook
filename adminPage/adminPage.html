<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordbook — админ-панель</title>
<link rel="stylesheet" href="adminPage.css">
</head>
    <body data-theme="light">

        <!-- ============ PRELOADER ============ -->
        <div class="preloader" id="preloader">
        <div class="preloader-inner">
            <div class="preloader-mark">
            <div class="preloader-logo">W</div>
            </div>
            <div style="text-align: center;">
            <div class="preloader-title">Wordbook</div>
            <div class="preloader-sub">Админ</div>
            </div>
            <div class="preloader-dots">
            <span></span><span></span><span></span>
            </div>
            <div class="preloader-bar">
            <div class="preloader-bar-fill" id="preloaderBar"></div>
            </div>
        </div>
        </div>

        <div class="app">
        <aside class="sidebar">
            <div class="brand">
            <div class="brand-logo">W</div>
            <div>
                <div class="brand-title">Wordbook</div>
                <div class="brand-sub">Админ</div>
            </div>
            </div>

            <div class="user-wrap">
            <button class="user-card" id="userCard" type="button" aria-haspopup="menu" aria-expanded="false">
                <div class="user-avatar" id="adminInitial">A</div>
                <div class="user-info">
                <div class="user-name" id="adminName">Администратор</div>
                <div class="user-role">админ</div>
                </div>
                <div class="user-caret">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
            </button>

            <div class="user-dropdown" id="userDropdown" role="menu">
                <button class="dropdown-item" id="menuBackToApp" type="button" role="menuitem">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                <span>К словарю</span>
                </button>
                <div class="dropdown-divider"></div>
                <button class="dropdown-item" id="menuSeed" type="button" role="menuitem">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                <span>Засеять демо-данными</span>
                </button>
                <button class="dropdown-item" id="menuSeedLogs" type="button" role="menuitem">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="8" y1="6" x2="21" y2="6"/>
                    <line x1="8" y1="12" x2="21" y2="12"/>
                    <line x1="8" y1="18" x2="21" y2="18"/>
                    <line x1="3" y1="6" x2="3.01" y2="6"/>
                    <line x1="3" y1="12" x2="3.01" y2="12"/>
                    <line x1="3" y1="18" x2="3.01" y2="18"/>
                </svg>
                <span>Засеять логи</span>
                </button>
                <button class="dropdown-item" id="menuClear" type="button" role="menuitem">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
                </svg>
                <span>Очистить пользователей</span>
                </button>
            </div>
            </div>

            <div class="sidebar-label">Управление</div>

            <div class="sidebar-scroll">
            <div class="nav-item active" data-nav="users">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                <span>Пользователи</span>
                <span class="nav-badge" id="navUsersBadge">0</span>
            </div>
            <div class="nav-item" data-nav="logs">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <line x1="8" y1="6" x2="21" y2="6"/>
                <line x1="8" y1="12" x2="21" y2="12"/>
                <line x1="8" y1="18" x2="21" y2="18"/>
                <line x1="3" y1="6" x2="3.01" y2="6"/>
                <line x1="3" y1="12" x2="3.01" y2="12"/>
                <line x1="3" y1="18" x2="3.01" y2="18"/>
                </svg>
                <span>Логи</span>
                <span class="nav-badge" id="navLogsBadge">0</span>
            </div>
            </div>

            <div class="sidebar-footer">
            <button class="theme-toggle" id="themeToggle" type="button">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <span id="themeLabel">Тёмная тема</span>
            </button>
            </div>
        </aside>

        <main class="main">
            <div class="main-header">
            <div class="breadcrumbs">
                <span>Wordbook</span>
                <span class="sep">/</span>
                <span>Админ</span>
                <span class="sep">/</span>
                <span class="current" id="breadcrumbCurrent">Пользователи</span>
            </div>

            <div class="main-title-row">
                <div class="main-title-wrap">
                <div class="main-title" id="mainTitle">Пользователи</div>
                <div class="title-count" id="titleCount"></div>
                </div>

                <div class="title-actions" id="titleActionsUsers">
                <button class="btn-ghost" id="refreshBtn" type="button">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"/>
                    <polyline points="1 20 1 14 7 14"/>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                    </svg>
                    Обновить
                </button>
                <button class="btn-primary" id="exportBtn" type="button">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Экспорт JSON
                </button>
                </div>

                <div class="title-actions" id="titleActionsLogs" style="display: none;">
                <button class="btn-ghost" id="refreshLogsBtn" type="button">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"/>
                    <polyline points="1 20 1 14 7 14"/>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                    </svg>
                    Обновить
                </button>
                <button class="btn-ghost danger" id="clearLogsBtn" type="button">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
                    </svg>
                    Очистить логи
                </button>
                </div>
            </div>
            </div>

            <div id="usersView" style="display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden;">
            <div class="admin-stats" id="adminStats"></div>

            <div class="admin-toolbar">
                <div class="search">
                <input type="text" id="searchInput" placeholder="Поиск по имени..." autocomplete="off">
                <button class="search-clear" id="searchClear" type="button" hidden>✕</button>
                </div>
                <div class="active-filter" id="activeFilter"></div>
            </div>

            <div class="head-row">
                <div>#</div>
                <div>Пользователь</div>
                <div>Роль</div>
                <div>Статус</div>
                <div>Регистрация</div>
                <div></div>
            </div>

            <div class="users-wrap" id="usersList"></div>

            <div class="pagination" id="pagination" hidden></div>
            </div>

            <div id="logsView" style="display: none; flex-direction: column; flex: 1; min-height: 0; overflow: hidden;">
            <div class="admin-stats" id="logsStats"></div>

            <div class="admin-toolbar">
                <div class="search">
                <input type="text" id="logSearchInput" placeholder="Поиск по объекту или деталям..." autocomplete="off">
                <button class="search-clear" id="logSearchClear" type="button" hidden>✕</button>
                </div>
                <div class="active-filter" id="logsActiveFilter"></div>
            </div>

            <div class="log-head-row">
                <div>Время</div>
                <div>Тип</div>
                <div>Объект</div>
                <div>Детали</div>
            </div>

            <div class="logs-wrap" id="logsList"></div>

            <div class="pagination" id="logsPagination" hidden></div>
            </div>
        </main>
        </div>

        <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2 id="confirmTitle">Подтвердите</h2>
            <p id="confirmText"></p>
            <div class="modal-actions">
            <button class="btn-ghost" type="button" id="confirmCancel">Отмена</button>
            <button class="btn-danger" type="button" id="confirmOk">Удалить</button>
            </div>
        </div>
        </div>

        <div class="modal-overlay" id="userModal">
        <div class="modal">
            <h2 id="userModalTitle">Пользователь</h2>
            <p id="userModalText"></p>
            <div class="modal-actions">
            <button class="btn-ghost" type="button" id="userModalClose">Закрыть</button>
            </div>
        </div>
        </div>

        
        <script src="adminPage.js"></script>
    </body>
</html>
